<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JapaneseFlow Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    /* Dashboard specific styles */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      flex: 1;
      margin: 0 5px;
      text-align: center;
    }
    .stat-box h3 { margin: 0; font-size: 24px; color: #38bdf8; }
    .stat-box p { margin: 5px 0 0; font-size: 14px; color: #cbd5f5; }
    
    .primary-btn {
      background: #f59e0b;
      font-size: 20px;
      padding: 18px;
    }
    .primary-btn:hover { background: #d97706; }
    
    .section-title {
      text-align: left;
      margin-top: 30px;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="dashboard-header">
  <h1>JapaneseFlow 🇯🇵</h1>

  <button
    id="installPwaBtn"
    style="
      display:none;
      background:#22c55e;
      color:white;
      border:none;
      border-radius:8px;
      padding:10px 15px;
      cursor:pointer;
      font-weight:bold;
    ">
    📥 Install App
  </button>
</div>

    <!-- SRS Stats -->
    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
      <div class="stat-box" style="flex: 1 1 30%;">
        <h3 id="levelStat">1</h3>
        <p>Level ⭐️</p>
      </div>
      <div class="stat-box" style="flex: 1 1 30%;">
        <h3 id="xpStat">0</h3>
        <p>XP ⚡️</p>
      </div>
      <div class="stat-box" style="flex: 1 1 30%;">
        <h3 id="achieveStat">0</h3>
        <p>Achievements 🏆</p>
      </div>
      <div class="stat-box" style="flex: 1 1 45%;">
        <h3 id="streakStat">0</h3>
        <p>Day Streak 🔥</p>
      </div>
      <div class="stat-box" style="flex: 1 1 45%;">
        <h3 id="goalStat">0/20</h3>
        <p>Daily Goal ✅</p>
      </div>
    </div>

    <h2 class="section-title">Study Queue</h2>
    <div class="level-buttons" style="display:flex; flex-direction:column; gap:10px;">
      <button id="reviewBtn" class="primary-btn" onclick="startReviews()">
        Reviews Due (0)
      </button>
      <button id="recommendBtn" class="primary-btn" style="background:#0ea5e9; font-size:16px;" onclick="goToRecommended()">
        🔍 Analyzing Next Step...
      </button>
    </div>

    <h2 class="section-title">Progress Tracking</h2>
    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
      <div class="stat-box" style="flex: 1 1 45%;">
        <h3 id="learnedStat">0</h3>
        <p>Learned 🌱</p>
      </div>
      <div class="stat-box" style="flex: 1 1 45%;">
        <h3 id="masteredStat">0</h3>
        <p>Mastered 👑</p>
      </div>
      <div class="stat-box" style="flex: 1 1 45%;">
        <h3 id="accuracyStat">0%</h3>
        <p>Accuracy 🎯</p>
      </div>
      <div class="stat-box" style="flex: 1 1 45%;">
        <h3 id="jlptStat">0%</h3>
        <p>JLPT N5 🏯</p>
      </div>
    </div>

    <h2 class="section-title">Library</h2>
    <div class="level-buttons">
      <button onclick="openScript('hiragana')">Hiragana</button>
      <button onclick="openScript('katakana')">Katakana</button>
      <button onclick="location.href='kanji-levels.html'">Kanji (JLPT)</button>
      <button onclick="location.href='grammar.html'" style="background:#8b5cf6;">Grammar (N5-N4)</button>
    </div>

    <h2 class="section-title">Activities</h2>
    <div class="level-buttons">
      <button onclick="location.href='song.html'">🎵 Hiragana Song</button>
      <button onclick="location.href='katakana-song.html'">🎵 Katakana Song</button>
      <button onclick="location.href='quiz.html'">Quiz Mode</button>
      <button onclick="goToStories()">Story Mode</button>
      <button onclick="location.href='search.html'">Search</button>
    </div>

    <hr style="margin-top: 40px; border-color: #334155;">
    <button style="background: transparent; color: #94a3b8; font-size: 14px;" onclick="location.href='contact.html'">Contact Us</button>

  </div>

  <script src="data-loader.js"></script>
  <script src="srs.js"></script>
  <script src="dashboard.js"></script>
  <script>
    function openScript(script) {
      localStorage.setItem("level", "basic");
      window.location.href = `characters.html?script=${script}`;
    }

    function goToStories() {
      window.location.href = "stories.html";
    }
    
    function startReviews() {
      window.location.href = "srs-review.html";
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }

    // PWA Install Logic
    let deferredPrompt;
    const installBtn = document.getElementById('installPwaBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent the mini-infobar from appearing on mobile
      e.preventDefault();
      // Stash the event so it can be triggered later.
      deferredPrompt = e;
      // Update UI notify the user they can install the PWA
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      // Hide the app provided install promotion
      installBtn.style.display = 'none';
      // Show the install prompt
      deferredPrompt.prompt();
      // Wait for the user to respond to the prompt
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`User response to the install prompt: ${outcome}`);
      // We've used the prompt, and can't use it again, throw it away
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      // Hide the app-provided install promotion
      installBtn.style.display = 'none';
      // Clear the deferredPrompt so it can be garbage collected
      deferredPrompt = null;
      console.log('PWA was installed');
    });

    // Also hide if already in standalone mode
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      installBtn.style.display = 'none';
    }
  </script>
</body>
</html>
