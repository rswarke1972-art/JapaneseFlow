<!DOCTYPE html>
<html>
<head>
    <button class="back-btn" onclick="goBack()">← Back</button>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="mode-switch">
  <button onclick="switchMode('simple')">Simple</button>
  <button onclick="switchMode('original')">Original</button>
  <button onclick="toggleFurigana()" id="furiganaBtn">Furigana: Off</button>
</div>

<div id="storyContainer"></div>

<div class="controls">
  <button onclick="prevLine()">⬅️</button>
  <button id="quizBtn" onclick="startQuiz()" style="display:none; background:#f59e0b;">📝 Quiz</button>
  <button onclick="nextLine()">➡️</button>
</div>

<!-- Quiz Overlay -->
<div id="quizOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.95); z-index:2000; overflow-y:auto; padding-top:50px;">
  <div class="container" style="background:#1e293b; padding:20px; border-radius:15px;">
    <h2 id="quizHeader">Story Quiz</h2>
    <div id="quizContent"></div>
    <p id="quizResult" style="font-size:18px; margin-top:15px;"></p>
    <button onclick="closeQuiz()" class="back-btn" style="width:100%; max-width:none;">Close Quiz</button>
  </div>
</div>

<div id="popup"></div>

<script src="data-loader.js"></script>
<script src="srs.js"></script>
<script src="story-viewer.js"></script>

</body>
</html>
